<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Find the FOTP GitHub release SHA-1</title>
  <desc id="desc">Publish a GitHub release, open its build workflow run summary, copy APK signer SHA-1 from Release APK OAuth identity, and paste it into the Android OAuth client.</desc>
  <rect width="1200" height="390" rx="32" fill="#111318"/>
  <text x="56" y="76" fill="#f4eff7" font-family="Arial, sans-serif" font-size="34" font-weight="700">Get the exact SHA-1 for your GitHub release</text>
  <text x="56" y="117" fill="#c4c6d0" font-family="Arial, sans-serif" font-size="20">The workflow prints it after signing the release APK. No local keytool command needed.</text>
  <g font-family="Arial, sans-serif">
    <rect x="56" y="166" width="245" height="142" rx="20" fill="#202127" stroke="#454750" stroke-width="2"/>
    <circle cx="91" cy="204" r="19" fill="#ffb1c8"/><text x="91" y="211" text-anchor="middle" fill="#3a1023" font-size="19" font-weight="700">1</text>
    <text x="84" y="252" fill="#f4eff7" font-size="21" font-weight="700">Publish release</text>
    <text x="84" y="282" fill="#c4c6d0" font-size="17">GitHub starts build</text>
    <path d="M316 237h38m-13-13 13 13-13 13" fill="none" stroke="#ffb1c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="369" y="166" width="245" height="142" rx="20" fill="#202127" stroke="#454750" stroke-width="2"/>
    <circle cx="404" cy="204" r="19" fill="#ffb1c8"/><text x="404" y="211" text-anchor="middle" fill="#3a1023" font-size="19" font-weight="700">2</text>
    <text x="397" y="252" fill="#f4eff7" font-size="21" font-weight="700">Open Actions run</text>
    <text x="397" y="282" fill="#c4c6d0" font-size="17">Choose the release run</text>
    <path d="M629 237h38m-13-13 13 13-13 13" fill="none" stroke="#ffb1c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="682" y="166" width="245" height="142" rx="20" fill="#202127" stroke="#454750" stroke-width="2"/>
    <circle cx="717" cy="204" r="19" fill="#ffb1c8"/><text x="717" y="211" text-anchor="middle" fill="#3a1023" font-size="19" font-weight="700">3</text>
    <text x="710" y="252" fill="#f4eff7" font-size="21" font-weight="700">Open Summary</text>
    <text x="710" y="282" fill="#c4c6d0" font-size="17">Copy APK signer SHA-1</text>
    <path d="M942 237h38m-13-13 13 13-13 13" fill="none" stroke="#ffb1c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="995" y="166" width="149" height="142" rx="20" fill="#202127" stroke="#454750" stroke-width="2"/>
    <circle cx="1030" cy="204" r="19" fill="#ffb1c8"/><text x="1030" y="211" text-anchor="middle" fill="#3a1023" font-size="19" font-weight="700">4</text>
    <text x="1070" y="252" text-anchor="middle" fill="#f4eff7" font-size="20" font-weight="700">Paste into</text>
    <text x="1070" y="282" text-anchor="middle" fill="#c4c6d0" font-size="17">Android client</text>
  </g>
  <text x="56" y="353" fill="#ffb1c8" font-family="Arial, sans-serif" font-size="18" font-weight="700">Expected package: com.dumbshrn.otphelper</text>
</svg>
