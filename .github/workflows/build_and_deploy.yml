name: build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2023.09.1
      options: --user root
    
    steps:
    - name: install git
      run: |
        sudo apt-get update;
        sudo apt-get -y install git;

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: setup JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: build
      run: | 
        ./gradlew --no-daemon :app:bundlePlayRelease  --stacktrace
        ./gradlew --no-daemon :app:assembleNormalRelease  --stacktrace

    - name: Sign App Apk
      if: ${{ github.event_name == 'release'}}
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/normal/release
        signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
        alias: ${{ secrets.ANDROID_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      env: 
        # found inside pulled layers detail of cimg/android inside docker hub after "/bin/bash -exo pipefail -c SDK_TOOLS_URL..."
        BUILD_TOOLS_VERSION: "33.0.1" 

    - name: Report release APK OAuth identity
      if: ${{ github.event_name == 'release' }}
      shell: bash
      run: |
        set -euo pipefail
        apk=$(find app/build/outputs/apk/normal/release -name '*signed.apk' -print -quit)
        test -n "$apk"
        build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
        application_id=$($build_tools/aapt dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
        sha1=$($build_tools/apksigner verify --print-certs "$apk" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')
        test "$application_id" = "com.dumbshrn.otphelper"
        test -n "$sha1"
        formatted_sha1=$(echo "$sha1" | sed 's/../&:/g; s/:$//')
        {
          echo "### Release APK OAuth identity"
          printf -- '- Application ID: `%s`\n' "$application_id"
          printf -- '- APK signer SHA-1: `%s`\n' "$formatted_sha1"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Sign App Bundle
      if: ${{ github.event_name == 'release' }}
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/bundle/playRelease
        signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
        alias: ${{ secrets.ANDROID_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      env: 
        # build tools version is found inside cimg/android related tag pulled layers details inside docker hub. after `...-c SDK_TOOLS_URL=...`
        BUILD_TOOLS_VERSION: "33.0.1" 
       
    - name: Release on GitHub
      uses: ncipollo/release-action@v1
      with:
        prerelease: true
        omitBody: true
        omitBodyDuringUpdate: true
        omitName: true
        allowUpdates: true
        replacesArtifacts: true
        updateOnlyUnreleased: true
        artifacts: app/build/outputs/apk/normal/release/*signed.apk,app/build/outputs/bundle/playRelease/*.aab

    - name: Push to Play Store
      if: ${{ github.event_name == 'release' && !contains(github.ref, '-rc') && vars.ENABLE_GOOGLE_PLAY_PUBLISH == 'true' }}
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        packageName: com.dumbshrn.otphelper
        releaseFiles: app/build/outputs/bundle/playRelease/*.aab
        track: internal
        status: draft
