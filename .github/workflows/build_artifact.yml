name: Build artifact (signed release)

# Builds a test APK on pushes to main and on manual dispatch. When release
# signing secrets are configured, it also uploads a signed release APK. It
# does NOT publish a GitHub release or push to Google Play. Use it to hand a
# production-faithful build to a user for
# log capture:
#
#   adb logcat -s OtpHelper:*
#
# This is the "normal" flavor release build, signed with the same release keys
# used for distribution. Logs are NOT stripped: proguard-android-optimize only
# removes Log calls when -assumenosideeffects is declared (it is not), so the
# AppLogger output survives minification. R8 may rename classes, but AppLogger
# uses a fixed string tag, so the single-tag logcat filter keeps working.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2023.09.1
      options: --user root

    steps:
      - name: install git
        run: |
          sudo apt-get update;
          sudo apt-get -y install git;

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test and build normal APKs
        run: ./gradlew --no-daemon :app:testNormalDebugUnitTest :app:assembleNormalDebug :app:assembleNormalRelease --stacktrace

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: otp-helper-test-apk
          path: app/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report test APK OAuth identity
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/normal/debug -name '*.apk' -print -quit)
          test -n "$apk"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          application_id=$($build_tools/aapt dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          sha1=$($build_tools/apksigner verify --print-certs "$apk" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')
          test "$application_id" = "com.dumbshrn.otphelper"
          test -n "$sha1"
          formatted_sha1=$(echo "$sha1" | sed 's/../&:/g; s/:$//')
          {
            echo "### Test APK OAuth identity"
            printf -- '- Application ID: `%s`\n' "$application_id"
            printf -- '- Debug signer SHA-1: `%s`\n' "$formatted_sha1"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_SIGNING_KEY" && -n "$ANDROID_ALIAS" && -n "$ANDROID_KEY_STORE_PASSWORD" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are incomplete; only the test APK will be uploaded."
          fi

      - name: Sign release APK
        if: steps.signing.outputs.configured == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/normal/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          # build tools version is found inside cimg/android related tag pulled
          # layers details inside docker hub. after `...-c SDK_TOOLS_URL=...`
          BUILD_TOOLS_VERSION: "33.0.1"

      - name: Upload signed release APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: otp-helper-normal-release-signed-apk
          path: app/build/outputs/apk/normal/release/*signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report OAuth app identity
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/normal/release -name '*signed.apk' -print -quit)
          test -n "$apk"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          application_id=$($build_tools/aapt dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          sha1=$($build_tools/apksigner verify --print-certs "$apk" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')
          test "$application_id" = "com.dumbshrn.otphelper"
          test -n "$sha1"
          formatted_sha1=$(echo "$sha1" | sed 's/../&:/g; s/:$//')
          {
            echo "### Release APK OAuth identity"
            printf -- '- Application ID: `%s`\n' "$application_id"
            printf -- '- APK signer SHA-1: `%s`\n' "$formatted_sha1"
          } >> "$GITHUB_STEP_SUMMARY"
